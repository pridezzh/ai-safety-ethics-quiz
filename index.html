const entries=DATA.questions.map(q=>({q,all:normalize(q.plain+' '+q.title),stem:normalize(q.stemText),answers:normalize(q.answers.join(' '))}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tokens(){return state.q.trim().split(/\s+/).map(normalize).filter(Boolean);}
function imageURL(name){return DATA.imageBase+name;}
function search(){
 const terms=tokens(),whole=normalize(state.q);let matches=[];
 for(const it of entries){
  if(state.ch&&it.q.ch!==state.ch)continue;
  if(state.view==='image'&&!it.q.images.length)continue;
  if(state.view==='judge'&&!it.q.judge)continue;
  if(!terms.every(t=>it.all.includes(t)))continue;
  let score=terms.reduce((n,t)=>n+(it.stem.includes(t)?6:0)+(it.answers.includes(t)?3:0),0);
  if(whole&&it.all.includes(whole))score+=12;
  matches.push({q:it.q,score});
 }
 if(terms.length)matches.sort((a,b)=>b.score-a.score||a.q.id-b.q.id);
 state.hits=matches;state.shown=20;render();syncURL();
}
function card(q){
 const images=q.images.map(name=>'<button class="figure-button" data-image="'+name+'" aria-label="放大第'+q.ch+'章第'+q.no+'题配图"><img src="'+imageURL(name)+'" alt="第'+q.ch+'章第'+q.no+'题配图" loading="lazy" decoding="async" referrerpolicy="no-referrer"></button>').join('');
 return '<article class="card" id="q'+q.id+'"><div class="meta"><span class="number">'+q.ch+'-'+String(q.no).padStart(2,'0')+'</span><span>'+esc(q.title)+'</span>'+(q.images.length?'<span class="badge">看图题</span>':'')+(q.judge?'<span class="badge">判断题</span>':'')+'<button class="copy" data-copy="'+q.id+'">复制题答</button></div><div class="stem">'+q.stemHtml+'</div>'+(images?'<div class="figures">'+images+'</div><p class="figure-hint">点击图片放大</p>':'')+'<details class="answer"'+(state.mask?'':' open')+'><summary>参考答案</summary><div class="answer-body">'+q.answerHtml+'</div></details><details class="original"><summary>查看完整原文</summary><div class="original-body">'+q.originalHtml+'</div></details></article>';
}
function highlight(){
 if(!state.q.trim()||!document.createTreeWalker)return;
 const terms=state.q.trim().split(/\s+/).filter(Boolean).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
 const re=new RegExp('('+terms.join('|')+')','gi');
 for(const root of document.querySelectorAll('.stem,.answer-body,.original-body')){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('math,.blank')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;const nodes=[];
  while(n=walker.nextNode())nodes.push(n);
  for(const node of nodes){const value=node.nodeValue;re.lastIndex=0;if(!re.test(value))continue;re.lastIndex=0;const fragment=document.createDocumentFragment();let last=0,m;while(m=re.exec(value)){fragment.append(value.slice(last,m.index));const mark=document.createElement('mark');mark.textContent=m[0];fragment.append(mark);last=m.index+m[0].length;}fragment.append(value.slice(last));node.replaceWith(fragment);}
 }
}
function render(){
 $('#count').textContent='找到 '+state.hits.length+' 道题';
 $('#list').innerHTML=state.hits.length?state.hits.slice(0,state.shown).map(h=>card(h.q)).join(''):'<div class="empty"><strong>没有找到匹配的题目</strong><p>试试缩短关键词，或选择“全部章节”“全部题目”。</p></div>';
 $('#shown').textContent=state.hits.length?'已显示 '+Math.min(state.shown,state.hits.length)+' / '+state.hits.length+' 题':'';
 $('#more').hidden=state.shown>=state.hits.length;
 highlight();
}
function syncURL(){try{const p=new URLSearchParams();if(state.q)p.set('q',state.q);if(state.ch)p.set('ch',state.ch);if(state.view!=='all')p.set('view',state.view);const s=p.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''));}catch(e){}}
let timer,toastTimer;
function toast(message){$('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',1800);}
$('#q').addEventListener('input',e=>{clearTimeout(timer);state.q=e.target.value;$('#clear').hidden=!state.q;timer=setTimeout(search,80);});
function clear(){clearTimeout(timer);state.q='';$('#q').value='';$('#clear').hidden=true;search();$('#q').focus();}
$('#clear').addEventListener('click',clear);
$('#chapter').innerHTML='<option value="0">全部章节 · 280题</option>'+DATA.chapters.map(c=>'<option value="'+c.id+'">'+esc(c.title)+' · '+c.count+'题</option>').join('');
$('#chapter').addEventListener('change',e=>{state.ch=+e.target.value;search();});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));search();}));
$('#mask').addEventListener('change',e=>{state.mask=e.target.checked;document.querySelectorAll('.answer').forEach(d=>d.open=!state.mask);try{localStorage.setItem('aiEthicsMask',state.mask?'1':'0');}catch(e){}});
$('#more').addEventListener('click',()=>{state.shown+=30;render();});
$('#list').addEventListener('click',async e=>{
 const copy=e.target.closest('[data-copy]');
 if(copy){const q=DATA.questions.find(x=>x.id===+copy.dataset.copy);const text=q.title+' 第'+q.no+'题\n'+q.plain+'\n参考答案：'+q.answers.join('；')+(q.images.length?'\n配图：'+q.images.map(imageURL).join('\n'):'');try{await navigator.clipboard.writeText(text);toast('题目与答案已复制');}catch(error){toast('复制未成功，可展开原文后手动选择复制');}return;}
 const image=e.target.closest('[data-image]');if(image){$('#large-image').src=imageURL(image.dataset.image);$('#viewer').showModal();}
});
$('#close-viewer').addEventListener('click',()=>$('#viewer').close());
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}if(e.key==='Escape'&&!$('#viewer').open)clear();});
try{state.mask=localStorage.getItem('aiEthicsMask')==='1';$('#mask').checked=state.mask;}catch(e){}
const p=new URLSearchParams(location.search);state.q=p.get('q')||'';$('#q').value=state.q;$('#clear').hidden=!state.q;
if(DATA.chapters.some(c=>String(c.id)===p.get('ch'))){state.ch=+p.get('ch');$('#chapter').value=String(state.ch);}
if(['all','image','judge'].includes(p.get('view'))){state.view=p.get('view');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));}
search();
</script>
</body>
</html>
